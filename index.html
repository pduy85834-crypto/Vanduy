<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VanDuy iOS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #000;
    color: white;
    min-height: 100vh;
    overflow: hidden;
}

/* Tuyết */
.snow {
    position: fixed;
    top: -20px;
    color: white;
    font-size: 14px;
    user-select: none;
    pointer-events: none;
    z-index: 0;
    animation: fall linear infinite;
}

@keyframes fall {
    0% {
        transform: translateY(-20px) translateX(0);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) translateX(80px);
        opacity: 0.2;
    }
}

/* Màn hình nhập key */
#login {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 90%;
    max-width: 380px;
    padding: 30px;
    background: rgba(10, 10, 10, 0.9);
    border: 1px solid #00d9ff;
    border-radius: 18px;
    box-shadow: 0 0 25px #00d9ff;
    text-align: center;
}

.login-box h1 {
    color: #00d9ff;
    margin-bottom: 25px;
    text-shadow: 0 0 15px #00d9ff;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #00d9ff;
    border-radius: 10px;
    background: #050505;
    color: white;
    outline: none;
    text-align: center;
    font-size: 16px;
    box-shadow: 0 0 10px rgba(0,217,255,.4);
}

.login-btn {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #00d9ff;
    color: #001014;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 15px #00d9ff;
}

.login-btn:hover {
    box-shadow: 0 0 30px #00d9ff;
}

#error {
    color: #ff4040;
    margin-top: 12px;
    display: none;
}

/* Giao diện chính */
#app {
    position: relative;
    z-index: 2;
    display: none;
    width: 100%;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
}

.title {
    text-align: center;
    color: #00d9ff;
    font-size: 28px;
    margin-bottom: 25px;
    text-shadow: 0 0 15px #00d9ff;
}

.card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10, 10, 10, .92);
    border: 1px solid #008caf;
    padding: 18px;
    margin: 14px 0;
    border-radius: 16px;
    box-shadow: 0 0 12px rgba(0,217,255,.35);
}

.info h2 {
    font-size: 18px;
    margin-bottom: 5px;
}

.info p {
    color: #999;
    font-size: 13px;
}

/* Công tắc */
.switch {
    position: relative;
    width: 58px;
    height: 30px;
    flex-shrink: 0;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: #222;
    border: 1px solid #555;
    border-radius: 30px;
    cursor: pointer;
    transition: .3s;
}

.slider:before {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    left: 3px;
    top: 3px;
    background: #aaa;
    border-radius: 50%;
    transition: .3s;
}

.switch input:checked + .slider {
    background: #00d9ff;
    border-color: #00d9ff;
    box-shadow: 0 0 15px #00d9ff, 0 0 30px rgba(0,217,255,.5);
}

.switch input:checked + .slider:before {
    transform: translateX(28px);
    background: white;
    box-shadow: 0 0 10px white;
}

/* Thông báo */
#toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translate(-50%, 100px);
    background: #061217;
    color: #fff;
    border: 1px solid #00d9ff;
    padding: 14px 22px;
    border-radius: 12px;
    box-shadow: 0 0 20px #00d9ff;
    opacity: 0;
    transition: .35s;
    z-index: 10;
    width: max-content;
    max-width: 90%;
    text-align: center;
}

#toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}
</style>
</head>

<body>

<!-- Tuyết -->
<div id="snow-container"></div>

<!-- Nhập key -->
<section id="login">
    <div class="login-box">
        <h1>VANDUY iOS</h1>

        <input
            type="password"
            id="keyInput"
            placeholder="Nhập key..."
            autocomplete="off"
        >

        <button class="login-btn" onclick="checkKey()">
            MỞ KHÓA
        </button>

        <div id="error">❌ Key không chính xác!</div>
    </div>
</section>

<!-- Giao diện chính -->
<section id="app">
    <div class="container">

        <div class="title">
            ⚡ VANDUY iOS
        </div>

        <!-- Nút 1 -->
        <div class="card">
            <div class="info">
                <h2>Fix Lag</h2>
                <p>Hỗ trợ tối ưu độ mượt</p>
            </div>

            <label class="switch">
                <input type="checkbox" onchange="toggleFeature(this, 'Đã bật tính năng Fix Lag')">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Nút 2 -->
        <div class="card">
            <div class="info">
                <h2>Răng Nhạy</h2>
                <p>Tăng độ nhạy thao tác</p>
            </div>

            <label class="switch">
                <input type="checkbox" onchange="toggleFeature(this, 'Đã bật tính năng Nhạy')">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Nút 3 -->
        <div class="card">
            <div class="info">
                <h2>Tối Ưu Điện Thoại</h2>
                <p>Tối ưu hiệu suất thiết bị</p>
            </div>

            <label class="switch">
                <input type="checkbox" onchange="toggleFeature(this, 'Đã bật tính năng Tối ưu điện thoại')">
                <span class="slider"></span>
            </label>
        </div>

    </div>
</section>

<div id="toast"></div>

<script>
/* Tạo tuyết */
function createSnow() {
    const snow = document.createElement("div");
    snow.className = "snow";
    snow.innerHTML = "❄";

    snow.style.left = Math.random() * 100 + "vw";
    snow.style.fontSize = (8 + Math.random() * 14) + "px";
    snow.style.animationDuration = (4 + Math.random() * 7) + "s";
    snow.style.animationDelay = Math.random() * 5 + "s";

    document.getElementById("snow-container").appendChild(snow);

    setTimeout(() => {
        snow.remove();
    }, 12000);
}

setInterval(createSnow, 180);

/* Kiểm tra key */
function checkKey() {
    const key = document.getElementById("keyInput").value;
    const error = document.getElementById("error");

    if (key === "vanduyios") {
        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";
        error.style.display = "none";

        showToast("✅ Mở khóa thành công!");
    } else {
        error.style.display = "block";
    }
}

/* Enter để mở khóa */
document.getElementById("keyInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        checkKey();
    }
});

/* Thông báo khi bật/tắt */
function toggleFeature(element, message) {
    if (element.checked) {
        showToast("✅ " + message);
    } else {
        showToast("⛔ Đã tắt tính năng");
    }
}

/* Toast */
let toastTimer;

function showToast(message) {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}
</script>

</body>
</html>
